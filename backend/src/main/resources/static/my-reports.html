<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6f8">
  <title>My reports | CrowdPeek</title>
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet">
  <script type="module" src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script type="module" src="js/myReports.js"></script>
</head>
<body><div id="site-nav"></div>
  <main class="container app-container page-content">
    <header class="page-header"><h1>My reports</h1><p>A record of the crowd levels you have shared.</p></header>
    <div id="reports-state" class="view-state" role="status" aria-live="polite">Loading your reports…</div>
    <div id="reports-wrap" class="table-responsive d-none">
      <table class="table reports-table"><thead><tr><th scope="col">Place</th><th scope="col">Level</th><th scope="col">Date and time</th></tr></thead><tbody id="reports-body"></tbody></table>
    </div>
    <div id="reports-empty" class="empty-panel d-none"><h2>No reports yet</h2><p>When you share a crowd level, it will appear here.</p><a class="btn btn-primary" href="index.html">Find a place</a></div>
  </main><div id="site-footer"></div>
  <div id="toast-root" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>
</body></html>
