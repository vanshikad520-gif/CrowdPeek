<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Place details | CrowdPeek</title>
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <script type="module" src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script type="module" src="js/place.js"></script>
</head>
<body>
  <div id="site-nav"></div>
  <main class="container app-container page-content">
    <nav aria-label="Breadcrumb" class="breadcrumb-wrap"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Places</a></li><li class="breadcrumb-item active" aria-current="page" id="place-breadcrumb">Place details</li></ol></nav>
    <div id="place-state" class="view-state" role="status" aria-live="polite">Loading place details…</div>
    <div id="place-content" class="d-none">
      <header class="page-header place-header">
        <div class="place-title-block"><h1 id="place-name"></h1><p id="place-meta"></p></div>
        <button id="place-favorite-button" class="favorite-toggle favorite-toggle-large" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><span>Save</span>
        </button>
      </header>
      <div class="detail-grid">
        <section class="panel current-panel" aria-labelledby="current-heading">
          <h2 id="current-heading">Right now</h2>
          <div class="crowd-summary"><strong class="crowd-percent" id="current-percent"></strong><span id="current-status"></span></div>
          <div class="level-scale" id="level-scale" role="img" aria-label="Current crowd level on a five-step scale"></div>
          <p class="advice-box" id="crowd-advice"></p>
          <p class="crowd-basis" id="crowd-basis"></p>
          <dl class="detail-list">
            <div><dt>Reports today</dt><dd id="reports-today"></dd></div>
            <div><dt>Last updated</dt><dd id="last-updated"></dd></div>
          </dl>
          <div class="place-actions">
            <button class="btn btn-primary" id="report-open" type="button" aria-expanded="false" aria-controls="report-panel">Report crowd</button>
            <button class="btn btn-outline-primary" id="place-share-button" type="button">Share</button>
            <a class="btn btn-outline-primary" id="place-whatsapp-link" href="https://wa.me/" target="_blank" rel="noopener">WhatsApp</a>
          </div>
          <section class="compare-control" aria-label="Compare this place">
            <label class="form-label" for="compare-place-select">Compare with</label>
            <div class="compare-control-fields">
              <select class="form-select" id="compare-place-select">
                <option value="">Choose a place</option>
              </select>
              <button class="btn btn-outline-primary" id="compare-place-button" type="button" disabled>Compare</button>
            </div>
          </section>
          <p id="report-location-note" class="report-location-note">We check that you are near the place.</p>
          <p id="verified-summary" class="verified-summary"></p>
          <section id="report-panel" class="report-panel d-none" aria-labelledby="report-panel-heading">
            <h3 id="report-panel-heading">How crowded is it?</h3>
            <form id="report-form">
              <fieldset class="report-options" id="report-options">
                <legend class="visually-hidden">Select current crowd level</legend>
              </fieldset>
              <div id="report-error" class="form-alert d-none" role="alert"></div>
              <button class="btn btn-primary w-100" id="report-submit" type="submit" disabled>Submit report</button>
            </form>
          </section>
        </section>
        <section class="panel chart-panel" aria-labelledby="typical-heading">
          <div class="panel-heading chart-panel-heading">
            <div><h2 id="typical-heading">Typical day</h2><p id="typical-subtitle">Average crowd by time of day</p></div>
            <div class="view-toggle day-type-toggle" role="group" aria-label="Typical day type">
              <button class="view-toggle-button" id="weekday-button" type="button" aria-pressed="false">Weekday</button>
              <button class="view-toggle-button" id="weekend-button" type="button" aria-pressed="false">Weekend</button>
            </div>
          </div>
          <div class="chart-container"><canvas id="crowd-chart" aria-label="Typical hourly crowd levels" role="img"></canvas></div>
        </section>
      </div>
      <section class="panel best-time-panel" aria-labelledby="best-time-heading">
        <h2 id="best-time-heading">Best time to visit</h2>
        <div class="best-time-grid" id="best-time-body"></div>
      </section>
      <section class="panel plan-visit-panel" aria-labelledby="plan-visit-heading">
        <div class="panel-heading">
          <div>
            <h2 id="plan-visit-heading">Plan your visit</h2>
            <p>Expected, based on typical days</p>
          </div>
        </div>
        <div class="plan-visit-controls">
          <label class="form-label" for="visit-time-select">Time</label>
          <select class="form-select" id="visit-time-select"></select>
        </div>
        <div class="plan-visit-result" aria-live="polite">
          <strong id="visit-crowd-percent" class="visit-crowd-percent tabular"></strong>
          <span id="visit-status"></span>
        </div>
        <p id="visit-advice" class="advice-box mb-0"></p>
      </section>
    </div>
  </main>
  <div id="toast-root" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>
  <div id="site-footer"></div>
</body>
</html>
