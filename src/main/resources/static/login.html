<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6f8">
  <title>Sign in | CrowdPeek</title>
  <link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet">
  <script type="module" src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script type="module" src="js/login.js"></script>
</head>
<body><div id="site-nav"></div>
  <main class="container app-container auth-page">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Sign in</h1><p class="auth-intro">Sign in to submit and review your crowd reports.</p>
      <div id="form-error" class="form-alert d-none" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <p class="auth-switch">New to CrowdPeek? <a href="register.html">Create an account</a></p>
    </section>
  </main><div id="site-footer"></div>
  <div id="toast-root" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>
</body></html>
